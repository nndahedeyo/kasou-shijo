<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="資産を預からず、注文の条件だけに署名し、全員同じ値段でまとめて約定する取引の試験所（テスト用）">
<title>仮想市場 試験所</title>
<meta name="color-scheme" content="light dark">
<style>

*{box-sizing:border-box}
html,body{overscroll-behavior-x:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}

header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}

button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700;width:100%}

<div class="wrap">
  <header><h1>仮想市場</h1><div style="display:flex;gap:14px;align-items:center"><span class="status" id="net" title="つないでいます"><i></i></span><button type="button" class="link" data-act="how">しくみ</button></div></header>
  <main id="main"></main>

</div>
<div class="panel" id="panel" aria-hidden="true"><div class="bar"><button type="button" data-act="back">‹ 戻る</button></div><div class="body"><div class="inner" id="pbody"></div></div></div>

<script>
// 仮想市場 試験所：まとめて約定させる計算（バッチオークション）。チェーンに関係なく動く。
// 注文は「sell を最大 sellAmount 渡して、1あたり buyMin/sellAmount 以上の割合で buy を受け取る。deadline まで有効」。
// 数量はすべて最小単位の整数（BigInt）。端数で誰かが損をしたり、資産が増えたり消えたりしないように計算する。
"use strict";

const big = v => BigInt(v);
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
// 値段は「Aの1単位あたりのBの単位数」を分数 n/d で表す
const cmpP = (p, q) => cmp(p.n * q.d, q.n * p.d);

function validate(o, now) {
  const errs = [];
  for (const k of ["id", "owner", "sell", "buy", "sellAmount", "buyMin", "deadline"]) if (o[k] === undefined) errs.push(k + " がない");
  if (errs.length) return errs;
  if (o.sell === o.buy) errs.push("同じ銘柄どうし");
  if (big(o.sellAmount) <= 0n) errs.push("渡す量が0以下");
  if (big(o.buyMin) <= 0n) errs.push("受け取る量が0以下");
  if (Number(o.deadline) <= now) errs.push("期限切れ");
  return errs;
}

// A を売る注文の下限値段 = buyMin/sellAmount、B を売る注文の上限値段 = sellAmount/buyMin（どちらも B per A）
function limitOf(o, A) {
  return o.sell === A ? {n: big(o.buyMin), d: big(o.sellAmount)} : {n: big(o.sellAmount), d: big(o.buyMin)};
}

function volumes(asks, bids, p) {
  // asks: A を売る、bids: B を売る（A を買う）
  const a = asks.filter(o => cmpP(o.lim, p) <= 0), b = bids.filter(o => cmpP(o.lim, p) >= 0);
  const S = a.reduce((s, o) => s + o.amt, 0n);                 // 売りに出た A
  const D = b.reduce((s, o) => s + (o.amt * p.d) / p.n, 0n);  // B で買える A
  return {a, b, S, D, V: S < D ? S : D};
}

// 一つの組（A と B）について、全員同じ値段で約定させる
function clear(orders, A, B, now) {
  const live = orders.filter(o => !validate(o, now).length && ((o.sell === A && o.buy === B) || (o.sell === B && o.buy === A)))
    .map(o => ({o, amt: big(o.sellAmount), lim: limitOf(o, A)}));
  let asks = live.filter(x => x.o.sell === A), bids = live.filter(x => x.o.sell === B);
  for (let guard = 0; guard < 50; guard++) {
    // 候補の値段：各注文の条件の値段と、隣り合う値段のちょうど中間
    const lims = [...asks, ...bids].map(x => x.lim).sort(cmpP);
    const cands = [];
    lims.forEach((p, i) => { cands.push(p); const q = lims[i + 1]; if (q && cmpP(p, q) < 0) cands.push({n: p.n * q.d + q.n * p.d, d: 2n * p.d * q.d}); });
    // 約定する量が一番多い値段を選ぶ。同じ量の値段が並ぶときは、その真ん中（どちらか一方だけが得をしない）
    let maxV = 0n; const vs = cands.map(p => { const v = volumes(asks, bids, p); if (v.V > maxV) maxV = v.V; return {p, v}; });
    const top = vs.filter(x => x.v.V === maxV && maxV > 0n);
    const best = top.length ? top[Math.floor((top.length - 1) / 2)] : null;
    if (!best) return {price: null, fills: []};
    const res = settle(best.p, best.v);
    const bad = res.fills.find(f => !meetsLimit(f));
    if (!bad) return {price: best.p, fills: res.fills};
    // 端数のせいで条件を割る注文があれば、その注文を外してやり直す
    asks = asks.filter(x => x.o.id !== bad.id); bids = bids.filter(x => x.o.id !== bad.id);
  }
  return {price: null, fills: []};
}

function prorata(list, total, key) {
  // total を list の key の比で整数に分ける。合計がぴったり total になるよう、余りは先頭から1ずつ
  const sum = list.reduce((s, x) => s + x[key], 0n);
  const out = list.map(x => (sum === 0n ? 0n : (x[key] * total) / sum));
  let r = total - out.reduce((s, v) => s + v, 0n);
  for (let i = 0; r > 0n; i = (i + 1) % out.length) { if (out[i] < list[i][key]) { out[i] += 1n; r -= 1n; } }
  return out;
}

function settle(p, {a, b, S, D}) {
  const fills = [];
  if (S <= D) {
    // A を売る側が全部約定。B を売る側は、受け取る A を比例で分ける
    const want = b.map(x => ({...x, cap: (x.amt * p.d) / p.n}));
    const aOut = prorata(want, S, "cap");
    const bGive = aOut.map(q => (q * p.n + p.d - 1n) / p.d);          // 切り上げ（買う側が端数を払う）
    const bRecv = a.map(x => (x.amt * p.n) / p.d);                      // 切り捨て
    let surplus = bGive.reduce((s, v) => s + v, 0n) - bRecv.reduce((s, v) => s + v, 0n);
    for (let i = 0; surplus > 0n && i < bGive.length; i++) { const t = bGive[i] - (aOut[i] * p.n) / p.d; const cut = t < surplus ? t : surplus; bGive[i] -= cut; surplus -= cut; }
    a.forEach((x, i) => fills.push(fill(x, x.amt, bRecv[i])));
    b.forEach((x, i) => fills.push(fill(x, bGive[i], aOut[i])));
    if (surplus > 0n) bRecv[0] += surplus, fills[0].receive = String(bRecv[0]);
  } else {
    // B を売る側が全部約定。A を売る側は、渡す A を比例で分ける
    const aIn = b.map(x => (x.amt * p.d) / p.n);
    const T = aIn.reduce((s, v) => s + v, 0n);
    const aGive = prorata(a, T, "amt");
    const bRecv = aGive.map(q => (q * p.n) / p.d);
    let surplus = b.reduce((s, x) => s + x.amt, 0n) - bRecv.reduce((s, v) => s + v, 0n);
    // B の売り手は全量を渡し、受け取る側の切り捨てで余った B は A の売り手に先頭から返す
    for (let i = 0; surplus > 0n && i < bRecv.length; i++) { bRecv[i] += 1n; surplus -= 1n; if (i === bRecv.length - 1) i = -1; }
    a.forEach((x, i) => fills.push(fill(x, aGive[i], bRecv[i])));
    b.forEach((x, i) => fills.push(fill(x, x.amt, aIn[i])));
  }
  return {fills: fills.filter(f => f.give !== "0" || f.receive !== "0")};
}

function fill(x, give, receive) {
  return {id: x.o.id, owner: x.o.owner, sell: x.o.sell, buy: x.o.buy, give: String(give), receive: String(receive), _o: x.o};
}
function meetsLimit(f) {
  const o = f._o, g = big(f.give), r = big(f.receive);
  if (g > big(o.sellAmount) || g < 0n || r < 0n) return false;
  return r * big(o.sellAmount) >= big(o.buyMin) * g;   // 受け取り/渡し ≥ buyMin/sellAmount
}

if (typeof module !== "undefined" && module.exports) module.exports = {clear, validate, meetsLimit};
else globalThis.Auction = {clear, validate, meetsLimit};

</script>
<script>
// 署名（BIP340 Schnorr / secp256k1）と Nostr のイベント。外部の部品を使わずに書いている。
// 公式の試験ベクトル（tests/sig.test.js）で正しさを確かめている。
"use strict";
(function (root) {
  const P = 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffefffffc2fn;
  const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;
  const GX = 0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798n;
  const GY = 0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8n;
  const mod = (a, m = P) => { const r = a % m; return r >= 0n ? r : r + m; };
  const pow = (b, e, m = P) => { let r = 1n; b = mod(b, m); while (e > 0n) { if (e & 1n) r = r * b % m; b = b * b % m; e >>= 1n; } return r; };
  const inv = (a, m = P) => { let [x, y, u, v] = [mod(a, m), m, 1n, 0n]; while (x !== 0n) { const q = y / x; [x, y] = [y - q * x, x]; [u, v] = [v - q * u, u]; } return mod(v, m); };

  // ヤコビ座標の点 [X, Y, Z]（Z=0 は無限遠点）
  const O = [0n, 1n, 0n];
  function dbl([X, Y, Z]) {
    if (Z === 0n || Y === 0n) return O;
    const A = X * X % P, B = Y * Y % P, C = B * B % P;
    const D = mod(2n * (mod((X + B) ** 2n) - A - C)), E = 3n * A % P, F = E * E % P;
    const X3 = mod(F - 2n * D), Y3 = mod(E * (D - X3) - 8n * C), Z3 = 2n * Y * Z % P;
    return [X3, Y3, Z3];
  }
  function add(p1, p2) {
    if (p1[2] === 0n) return p2; if (p2[2] === 0n) return p1;
    const [X1, Y1, Z1] = p1, [X2, Y2, Z2] = p2;
    const Z1Z1 = Z1 * Z1 % P, Z2Z2 = Z2 * Z2 % P;
    const U1 = X1 * Z2Z2 % P, U2 = X2 * Z1Z1 % P, S1 = Y1 * Z2 % P * Z2Z2 % P, S2 = Y2 * Z1 % P * Z1Z1 % P;
    if (U1 === U2) return S1 === S2 ? dbl(p1) : O;
    const H = mod(U2 - U1), I = (2n * H) ** 2n % P, J = H * I % P, r = mod(2n * (S2 - S1)), V = U1 * I % P;
    const X3 = mod(r * r - J - 2n * V), Y3 = mod(r * (V - X3) - 2n * S1 * J), Z3 = mod(((Z1 + Z2) ** 2n - Z1Z1 - Z2Z2) * H);
    return [X3, Y3, Z3];
  }
  function mul(pt, k) { let R = O, Q = pt; while (k > 0n) { if (k & 1n) R = add(R, Q); Q = dbl(Q); k >>= 1n; } return R; }
  function affine([X, Y, Z]) { if (Z === 0n) return null; const zi = inv(Z), z2 = zi * zi % P; return [X * z2 % P, Y * z2 % P * zi % P]; }
  const G = [GX, GY, 1n];
  // G の倍数は表を作っておく（署名と確認を速くする）
  const GT = []; { let q = G; for (let i = 0; i < 256; i++) { GT.push(q); q = dbl(q); } }
  function mulG(k) { let R = O; for (let i = 0; k > 0n; i++, k >>= 1n) if (k & 1n) R = add(R, GT[i]); return R; }

  const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  const unhex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
  const num = b => BigInt("0x" + (hex(b) || "0"));
  const n32 = x => unhex(x.toString(16).padStart(64, "0"));
  const cat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let i = 0; for (const x of a) { o.set(x, i); i += x.length; } return o; };
  const enc = new TextEncoder();
  const subtle = (root.crypto && root.crypto.subtle) || require("crypto").webcrypto.subtle;
  const sha = async b => new Uint8Array(await subtle.digest("SHA-256", b));
  const tagged = async (tag, ...m) => { const t = await sha(enc.encode(tag)); return sha(cat(t, t, ...m)); };

  function liftX(x) {
    if (x >= P) return null;
    const c = mod(x ** 3n + 7n), y = pow(c, (P + 1n) / 4n);
    if (y * y % P !== c) return null;
    return [x, y & 1n ? P - y : y, 1n];
  }
  function pubkey(sk) { const d = num(sk); if (d <= 0n || d >= N) throw new Error("bad key"); return n32(affine(mulG(d))[0]); }
  async function sign(msg, sk, aux) {
    let d = num(sk); if (d <= 0n || d >= N) throw new Error("bad key");
    const Pa = affine(mulG(d)); if (Pa[1] & 1n) d = N - d;
    const px = n32(Pa[0]);
    const t = n32(d ^ num(await tagged("BIP0340/aux", aux)));
    const k0 = mod(num(await tagged("BIP0340/nonce", t, px, msg)), N); if (k0 === 0n) throw new Error("bad nonce");
    const R = affine(mulG(k0)); const k = R[1] & 1n ? N - k0 : k0;
    const rx = n32(R[0]);
    const e = mod(num(await tagged("BIP0340/challenge", rx, px, msg)), N);
    return cat(rx, n32(mod(k + e * d, N)));
  }
  async function verify(msg, pk, sig) {

async function emitA(c, sk) {
  sk = sk || me.sk; const pk = Sig.hex(Sig.pubkey(Sig.unhex(sk)));
  const last = aev.filter(e => e.pubkey === pk).reduce((m, e) => Math.max(m, e.created_at), 0);
  const newest = aev.reduce((m, e) => e.created_at <= now() + 5 ? Math.max(m, e.created_at) : m, 0);
  const e = await Sig.signEvent({kind: AC.KIND, tags: [["t", AC.TAG]], content: JSON.stringify(c), created_at: Math.max(now(), last + 1, newest + 1)}, sk);
  addEv(e); outbox.push(e); saveEv(); flush(); recount(); return e;
}
const okEv = e => { const l = AS.log.find(x => x.id === e.id); return !!(l && l.ok); };

// 市場の台帳（見本）とアカウントを結ぶ
function attachMarket() {

}

async function openAccount(handle){

  if (!AC.HANDLE.test(handle)) { note = {k: "warn", m: "名前は、英小文字・数字・ハイフンで2〜20文字にしてください。"}; return render(); }
  if (AS.byHandle[handle]) { note = {k: "warn", m: `@${handle} はもう使われています。前に作った本人なら「前のアカウントで開く」から。`}; return render(); }
  const k = await newKey(handle); setMe(k.sk, k.how);
  const e = await emitA({t: "open", handle, display: handle});
  if (!okEv(e)) { note = {k: "warn", m: "開けませんでした。名前を変えてもう一度。"}; me = null; saveMe(); return render(); }

/* ---------- 注文 ---------- */
function draft(){
  const qty = toU($("#qty") && $("#qty").value);
  const custom = Number($("#px") && $("#px").value);
  const px = custom > 0 ? custom : side === "buy" ? S.ref * (1 + SLIP) : S.ref * (1 - SLIP);
  if (!qty) return null;
  const usd = BigInt(Math.round(Number(qty) * px));
  return side === "buy"
    ? {sell: "tUSD", buy: "tETH", sellAmount: usd, buyMin: qty, qty, px, custom: custom > 0}
    : {sell: "tETH", buy: "tUSD", sellAmount: qty, buyMin: usd, qty, px, custom: custom > 0};
}
function free(t){ return S.bal[t] - S.mine.filter(o => o.st === "open" && o.sell === t).reduce((s, o) => s + BigInt(o.sellAmount), 0n); }
function hint(d){
  if (!d) return "量を入れてください。";
  if (free(d.sell) < d.sellAmount) return `<span class="s">${TOK[d.sell]}が足りません。</span>`;
  return d.custom ? `1 ETH あたり ${d.px.toFixed(2)} ドル${side === "buy" ? "まで" : "から"}で約定します。` : `いまの値段より1%以上不利なら、約定せずに消えます。`;
}

async function sign(d){
  try {
    if (S.acct.how === "パスキー" && navigator.credentials) await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification: "required", timeout: 60000}});
  } catch (e) { note = {k: "warn", m: "署名をやめました。注文は出ていません。"}; closePanel(); return render(); }
  const o = {id: "m" + S.seq++, owner: S.acct.name, sell: d.sell, buy: d.buy, sellAmount: String(d.sellAmount), buyMin: String(d.buyMin), deadline: now() + 60, st: "open", px: d.px, qty: String(d.qty), side};
  S.mine.unshift(o); S.book.push(o);
  note = {k: "ok", m: "注文を出しました。約定するまで、資産はあなたのアカウントから動きません。"};
  save(); closePanel(); render();
}

/* ---------- ほかの参加者（見本） ---------- */
function botOrders(){
  S.ref = Math.max(500, S.ref * (1 + (Math.random() - 0.5) * 0.01));
  const n = 3 + Math.floor(Math.random() * 4), out = [];
  for (let i = 0; i < n; i++) {
    const sell = Math.random() < 0.5, px = S.ref * (1 + (Math.random() - (sell ? 0.35 : 0.65)) * 0.012);
    const qty = BigInt(Math.round((0.05 + Math.random() * 0.6) * 1e6)), usd = BigInt(Math.round(Number(qty) * px));
    out.push({id: "b" + S.seq++, owner: "参加者", sell: sell ? "tETH" : "tUSD", buy: sell ? "tUSD" : "tETH",
      sellAmount: String(sell ? qty : usd), buyMin: String(sell ? usd : qty), deadline: now() + BATCH + 1, st: "open"});
  }
  return out;
}

function clearNow(){
  const t = now();
  S.book = S.book.filter(o => o.st === "open" && o.deadline > t);
  let expired = false;
  for (const o of S.mine) if (o.st === "open" && o.deadline <= t) { o.st = "expired"; expired = true; }
  const r = A.clear(S.book.concat(botOrders()), "tETH", "tUSD", t);
  const price = r.price ? Number(r.price.n) / Number(r.price.d) : null;
  let got = null;
  for (const f of r.fills) {
    const m = S.mine.find(o => o.id === f.id);
    if (!m) continue;
    S.bal[f.sell] -= BigInt(f.give); S.bal[f.buy] += BigInt(f.receive);
    const left = BigInt(m.sellAmount) - BigInt(f.give);
    if (left > 0n) { m.buyMin = String(BigInt(m.buyMin) * left / BigInt(m.sellAmount)); m.sellAmount = String(left); } else m.st = "done";
    m.last = {give: f.give, receive: f.receive, price};
    got = {f, price};
  }
  S.book = S.book.filter(o => o.st === "open");
  if (price) S.ref = price;
  S.hist.unshift({t, price}); S.hist = S.hist.slice(0, 30);
  if (got) note = {k: "ok", m: `約定しました。${fmt(got.f.give, dp(got.f.sell))} ${TOK[got.f.sell]}を渡して、${fmt(got.f.receive, dp(got.f.buy))} ${TOK[got.f.buy]}を受け取りました。同じまとめの全員が、1 ETH ${got.price.toFixed(2)} ドルで約定しています。`};
  else if (expired) note = {k: "warn", m: "期限までに条件に合う相手がいなかった注文が、何も起きずに消えました。資産は動いていません。"};
  S.next = t + BATCH; save();
  live(!!got || expired, !!got);
}
window.__clearNow = clearNow;

  const ps = S.hist.slice().reverse().map(h => h.price).filter(Boolean);

  const lo = Math.min(...ps), hi = Math.max(...ps), w = 300, h = 40, k = hi - lo || 1;
  const pts = ps.map((p, i) => `${(i / (ps.length - 1) * w).toFixed(1)},${(h - 4 - (p - lo) / k * (h - 8)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

      <label>ひとこと<input id="pf-l" maxlength="80" value="${esc(A.line)}" placeholder="個人開発をしています"></label>
      <label>リンク<input id="pf-u" inputmode="url" value="${esc(A.links[0] || "")}" placeholder="https://"></label>
      <button type="button" data-act="save-card">保存</button></div>
    <div class="card grid2"><b>信頼できる人</b><span class="small">かぎをなくしたとき、この人たちの承認で新しい端末に取り戻せます。3人を決めて、2人の承認にしておくのがおすすめです。</span>
      <div>${gDraft.list.length ? gDraft.list.map(id => `<div class="gl"><span>${esc(H(id))}</span><button type="button" class="link" data-act="g-del" data-id="${id}">外す</button></div>`).join("") : `<p class="small" style="margin:0">まだいません</p>`}</div>
      ${gDraft.list.length < AC.R.maxGuardians ? `<div style="display:flex;gap:8px"><input id="g-add" placeholder="@なまえ" autocapitalize="none" spellcheck="false"><button type="button" data-act="g-add">足す</button></div>` : ""}
      ${gDraft.list.length ? `<label>何人の承認で取り戻せるか<input id="g-need" type="number" min="1" max="${gDraft.list.length}" value="${Math.min(gDraft.need, gDraft.list.length)}"></label>` : ""}
      ${A.pendingGuard ? `<p class="small" style="margin:0;color:var(--warn)">替えた信頼できる人は、${Math.max(1, Math.ceil((A.pendingGuard.at + AC.R.wait - now()) / 86400))}日後に効きます（かぎを盗まれたとき、すぐに替えられないようにするため）。それまでは前の人たちで取り戻せます。</p>` : ""}
      <p class="small" id="g-msg" style="margin:0;color:var(--warn)" role="alert"></p>
      <button type="button" data-act="g-save">決める</button></div>
    <div class="card grid2"><b>この端末</b>
      <span class="small">${me.how === "パスキー" ? "かぎはパスキー（顔認証・指紋）から作られます。同じパスキーが入った端末なら、どれでも開けます。" : "この端末ではパスキーが使えないため、かぎはこの端末の中だけにあります。信頼できる人を決めておいてください。"}</span>
      <div class="gl"><span>番号</span><span class="small mono" style="word-break:break-all;text-align:right">${A.id}</span></div>
      <div class="gl"><span>試験チェーン（Base Sepolia）のアドレス</span><span class="small mono" style="word-break:break-all;text-align:right">${addrOf(me.sk)}</span></div>
      <button type="button" class="link" data-act="forget">この端末から閉じる</button></div>`;
}
function refreshAcctPanel() { if ($("#pbody .idcard") && !document.activeElement.matches("#pbody input")) { $("#pbody").innerHTML = acctHtml(); } }
function lostHtml() {
  return `<h2>かぎをなくした</h2><p class="small" style="margin:0">新しいかぎをこの端末で作り、信頼できる人の承認で、前のアカウントを取り戻します。承認がそろってから3日で使えるようになります。</p>
    <label>前のアカウントの名前<input id="lost-h" placeholder="@なまえ" autocapitalize="none" spellcheck="false"></label>
    <p class="small" id="lost-msg" style="margin:0;color:var(--warn)" role="alert"></p>
    <button type="button" class="primary" data-act="lost-go">取り戻しを頼む</button>`;
}
const howHtml = () => `<h2>しくみ</h2><div class="sheet how" style="display:grid;gap:18px">${HOW.map(([t, b]) => `<div><h3>${t}</h3><p>${b}</p></div>`).join("")}</div>`;

// 横に払うと戻る（左右どちらでも）。縦のスクロールの邪魔はしない
(() => {
  const p = $("#panel"); let x0 = 0, y0 = 0, dx = 0, track = false;
  p.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; track = null; }, {passive: true});
  p.addEventListener("touchmove", e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (track === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) track = Math.abs(mx) > Math.abs(my) * 1.4;
    if (!track) return;
    dx = mx; p.style.transition = "none"; p.style.transform = `translateX(${dx}px)`;
  }, {passive: true});
  p.addEventListener("touchend", () => {
    if (!track) return; p.style.transition = "";
    if (Math.abs(dx) > 70) { p.style.transform = `translateX(${dx > 0 ? 100 : -100}%)`; setTimeout(closePanel, 220); } else p.style.transform = "";
  });
})();

async function act(a, t){
  const id = t && t.dataset.id;
  if (a === "open") return openAccount($("#nm").value);
  if (a === "reopen") return reopen();
  if (a === "name") {
    const h = ($("#nm").value || "").trim().toLowerCase().replace(/^@/, "");
    if (!AC.HANDLE.test(h) || AS.byHandle[h]) { note = {k: "warn", m: AS.byHandle[h] ? `@${h} はもう使われています。` : "英小文字・数字・ハイフンで2〜20文字にしてください。"}; return render(); }
    await emitA({t: "name", handle: h}); note = null; return render();
  }
  if (a === "lost") return openPanel(lostHtml());
  if (a === "lost-go") {
    const X = AC.byHandle(AS, $("#lost-h").value);
    if (!X) { $("#lost-msg").textContent = "その名前のアカウントが見つかりません。"; return; }
    if (!X.guard.list.length) { $("#lost-msg").textContent = "このアカウントには信頼できる人が決められていないので、取り戻せません。"; return; }
    const k = await newKey(X.handle); setMe(k.sk, k.how); me.recovering = X.id; saveMe();
    await emitA({t: "ask", account: X.id}); closePanel(); return render();
  }
  if (a === "forget") { me = null; saveMe(); S = fresh(); save(); note = null; closePanel(); return render(); }
  if (a === "acct") { gDraft = null; return openPanel(acctHtml()); }
  if (a === "save-card") { await emitA({t: "card", display: $("#pf-d").value.trim(), line: $("#pf-l").value.trim(), links: $("#pf-u").value.trim() ? [$("#pf-u").value.trim()] : []}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "g-add") {
    const X = AC.byHandle(AS, $("#g-add").value), A = myAcct();
    if (!X || X.id === A.id) { $("#g-msg").textContent = "その名前のアカウントが見つかりません（自分は入れられません）。"; return; }
    if (!gDraft.list.includes(X.id)) gDraft.list.push(X.id); $("#pbody").innerHTML = acctHtml(); return;
  }
  if (a === "g-del") { gDraft.list = gDraft.list.filter(x => x !== id); $("#pbody").innerHTML = acctHtml(); return; }
  if (a === "g-save") {
    const need = gDraft.list.length ? Math.max(1, Math.min(gDraft.list.length, parseInt($("#g-need").value) || 1)) : 0;
    const e = await emitA({t: "guard", list: gDraft.list, need}); gDraft = null; $("#pbody").innerHTML = acctHtml(); render();
    $("#g-msg").textContent = okEv(e) ? "" : "決められませんでした。"; if (okEv(e)) { note = {k: "ok", m: "信頼できる人を決めました。"}; } return;
  }
  if (a === "approve") { await emitA({t: "approve", account: id, to: t.dataset.to}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "cancel-rec") { await emitA({t: "cancel", to: id}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "how") return openPanel(howHtml());
  if (a === "back") return closePanel();
  if (a === "dismiss") { note = null; $("#note") ? ($("#note").innerHTML = "") : render(); return; }
  if (a === "review") {
    const d = draft(); if (!d) return;
    if (free(d.sell) < d.sellAmount) { note = {k: "warn", m: `${TOK[d.sell]}が足りません。`}; $("#note").innerHTML = noteHtml(); return; }
    pending = d; return openPanel(reviewHtml(d));
  }
  if (a === "sign") return pending && sign(pending);
  if (a === "cancel") { for (const o of S.mine) if (o.st === "open") o.st = "cancelled"; S.book = S.book.filter(o => !o.id.startsWith("m")); note = {k: "ok", m: "注文を取り消しました。資産は最初から動いていません。"}; save(); return live(true); }
}
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-act],[data-side]");
  if (!t) return;
  if (t.dataset.side) { side = t.dataset.side; S.lastQty = $("#qty") ? $("#qty").value : S.lastQty; return render(); }
  act(t.dataset.act, t);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#panel").classList.contains("on")) closePanel(); });
$("#reset").onclick = () => { const id = S.acct && S.acct.id; S = fresh(); note = null; closePanel(); save(); attachMarket(); render(); };
setInterval(() => { if (S.acct && myAcct() && S.next - now() <= 0) clearNow(); }, 1000);
setInterval(() => { const before = myAcct(); recount(); if (!before && myAcct()) onAccount(); flush(); netStatus(); }, 15000);   // 取り戻しの3日などを数え直す
if (me && !myAcct() && S.acct && !S.acct.id) { S = fresh(); save(); }   // 前の試作の台帳は使わない
render();
if ("WebSocket" in window) for (const u of RELAYS) connectOne(u, 2000);
window.__acct = {tick: () => { recount(); onAccount(); render(); }, get AS() { return AS; }, get me() { return me; }};
</script>
</body>
