@media (prefers-reduced-motion:reduce){.wait i,.idcard.glow{animation:none}.panel{transition:none}}

<script>
"use strict";
const A = globalThis.Auction;
const $ = s => document.querySelector(s);
const U = 1000000n;                    // 最小単位（小数6桁）
const BATCH = 10;                      // まとめる間隔（秒）。画面には出さない
const SLIP = 0.01;                     // 何も指定しないときの、許す値段のずれ（1%）
const KEY = "kasou-shijo.v1";
const TOK = {tETH: "試験ETH", tUSD: "試験ドル"};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, dp = 4) => { v = BigInt(v); const neg = v < 0n; if (neg) v = -v; const i = v / U, f = (v % U).toString().padStart(6, "0").slice(0, dp); return (neg ? "-" : "") + i.toLocaleString("ja-JP") + (dp ? "." + f : ""); };
const dp = t => t === "tUSD" ? 2 : 4;
const toU = x => { const n = Number(x); if (!isFinite(n) || n <= 0) return 0n; return BigInt(Math.round(n * 1e6)); };
const now = () => Math.floor(Date.now() / 1000);

let S = load();
function fresh(){ return {acct: null, bal: {tETH: 0n, tUSD: 0n}, book: [], hist: [], mine: [], ref: 3000, seq: 1, next: now() + BATCH}; }
function load(){
  try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j && j.bal) { j.bal = {tETH: BigInt(j.bal.tETH), tUSD: BigInt(j.bal.tUSD)}; j.next = now() + BATCH; j.book = j.book || []; return j; } } catch (e) {}
  return fresh();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S, (k, v) => typeof v === "bigint" ? v.toString() : v)); } catch (e) {} }

let side = "buy", note = null, pending = null;

/* ---------- アカウント（がまぐち・jeni のプロフィールカードにあたる部分） ----------
   かぎはパスキー（顔認証・指紋）から毎回作り直す。パスキーが同期される端末なら、どの端末でも同じアカウントで開ける。
   パスキーが使えない端末では、この端末の中にかぎを置く（そのときは信頼できる人を決めておくのが大事）。 */
const AC = globalThis.Account, enc = new TextEncoder();
const MEKEY = "kasou.me", EVKEY = "kasou.acct.events";
let me = (() => { try { return JSON.parse(localStorage.getItem(MEKEY) || "null"); } catch (e) { return null; } })();   // {sk, pk, how}
const saveMe = () => { try { localStorage.setItem(MEKEY, JSON.stringify(me)); } catch (e) {} };
let aev = (() => { try { return JSON.parse(localStorage.getItem(EVKEY) || "[]"); } catch (e) { return []; } })();
let AS = AC.reduce(aev, now());
const recount = () => { AS = AC.reduce(aev, now()); };
const myAcct = () => me && AS.accounts[AS.byKey[me.pk]] || null;
const hexs = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join("");
const addrOf = sk => { const h = hexs(Keccak.keccak256(Sig.pubXY(sk))).slice(24); const k = hexs(Keccak.keccak256(enc.encode(h)));
  return "0x" + [...h].map((c, i) => parseInt(k[i], 16) >= 8 ? c.toUpperCase() : c).join(""); };   // 大文字小文字で書き間違いを見つける形（EIP-55）
const shortNo = pk => pk.slice(0, 4) + "·" + pk.slice(4, 8) + "·" + pk.slice(-4);
const codeOf = pk => pk.slice(0, 4).toUpperCase();   // 取り戻しの合言葉（新しいかぎの頭4文字）

const SALT = enc.encode("kasou-account-v1");
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function keyFromPrf(first) { return Sig.toKey(await Sig.sha(new Uint8Array([...enc.encode("kasou/account/key"), ...new Uint8Array(first)]))); }
async function passkeyNew(handle) {
  if (!window.PublicKeyCredential || !navigator.credentials) return null;
  try {
    const c = await navigator.credentials.create({publicKey: {challenge: rand(32), rp: {name: "nndahedeyo"}, user: {id: rand(16), name: "@" + handle, displayName: "@" + handle},
      pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -257}], authenticatorSelection: {residentKey: "required", userVerification: "required"},
      timeout: 60000, extensions: {prf: {eval: {first: SALT}}}}});
    const x = c.getClientExtensionResults().prf;
    if (x && x.results && x.results.first) return keyFromPrf(x.results.first);
    if (x && x.enabled) return passkeyOpen([{type: "public-key", id: c.rawId}]);
  } catch (e) {}
  return null;
}
async function passkeyOpen(allow) {
  if (!window.PublicKeyCredential || !navigator.credentials) return null;
  try {
    const g = await navigator.credentials.get({publicKey: {challenge: rand(32), userVerification: "required", timeout: 60000, ...(allow ? {allowCredentials: allow} : {}), extensions: {prf: {eval: {first: SALT}}}}});
    const x = g.getClientExtensionResults().prf;
    if (x && x.results && x.results.first) return keyFromPrf(x.results.first);
  } catch (e) {}
  return null;
}
async function newKey(handle) {
  const k = await passkeyNew(handle);
  return k ? {sk: k, how: "パスキー"} : {sk: Sig.newKey(), how: "この端末"};
}
const setMe = (sk, how) => { me = {sk, pk: Sig.hex(Sig.pubkey(Sig.unhex(sk))), how}; saveMe(); };

// 出来事を出す・受け取る（Nostr の中継。相互レビューと同じしくみ）
const RELAYS = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.nostr.band"];
const socks = []; let outbox = (() => { try { return JSON.parse(localStorage.getItem("kasou.outbox") || "[]"); } catch (e) { return []; } })();
const saveEv = () => { try { localStorage.setItem(EVKEY, JSON.stringify(aev.slice(-4000))); localStorage.setItem("kasou.outbox", JSON.stringify(outbox)); } catch (e) {} };
function addEv(e) { if (aev.some(x => x.id === e.id)) return false; aev.push(e); saveEv(); return true; }
let tAcc;
async function accept(e) {
  if (!e || e.kind !== AC.KIND || !(e.tags || []).some(t => t[0] === "t" && t[1] === AC.TAG)) return;
  if (!(await Sig.verifyEvent(e))) return;
  if (addEv(e)) { clearTimeout(tAcc); tAcc = setTimeout(() => { recount(); onAccount(); }, 150); }
}
const openSocks = () => socks.filter(s => s.readyState === 1);
function flush() { const os = openSocks(); if (!os.length) return; for (const e of outbox) for (const s of os) s.send(JSON.stringify(["EVENT", e])); outbox = []; saveEv(); }
function connectOne(url, wait) {
  let ws; try { ws = new WebSocket(url); } catch (e) { return; }
  ws.onopen = () => { wait = 2000; ws.send(JSON.stringify(["REQ", "ac", {kinds: [AC.KIND], "#t": [AC.TAG], limit: 2000}])); flush(); netStatus(); };
  ws.onmessage = m => { try { const d = JSON.parse(m.data); if (d[0] === "EVENT") accept(d[2]); } catch (e) {} };
  ws.onclose = () => { const i = socks.indexOf(ws); if (i >= 0) socks.splice(i, 1); netStatus(); setTimeout(() => connectOne(url, Math.min((wait || 2000) * 2, 60000)), wait || 2000); };
  ws.onerror = () => {};
  socks.push(ws);
}
function netStatus() { const n = $("#net"); if (!n) return; const on = openSocks().length > 0; n.className = "status" + (on ? " on" : ""); n.title = on ? "つながっています" : "つないでいます"; }
async function emitA(c, sk) {
  sk = sk || me.sk; const pk = Sig.hex(Sig.pubkey(Sig.unhex(sk)));
  const last = aev.filter(e => e.pubkey === pk).reduce((m, e) => Math.max(m, e.created_at), 0);
  const newest = aev.reduce((m, e) => e.created_at <= now() + 5 ? Math.max(m, e.created_at) : m, 0);
  const e = await Sig.signEvent({kind: AC.KIND, tags: [["t", AC.TAG]], content: JSON.stringify(c), created_at: Math.max(now(), last + 1, newest + 1)}, sk);
  addEv(e); outbox.push(e); saveEv(); flush(); recount(); return e;
}
const okEv = e => { const l = AS.log.find(x => x.id === e.id); return !!(l && l.ok); };

// 市場の台帳（見本）とアカウントを結ぶ
function attachMarket() {
  const A = myAcct(); if (!A) return;
  if (!S.acct || S.acct.id !== A.id) { S = fresh(); S.acct = {id: A.id, name: A.handle, how: me.how, at: Date.now()}; S.bal = {tETH: 2n * U, tUSD: 6000n * U}; save(); }   // 試験用の配布
  S.acct.name = A.handle; S.acct.how = me.how;
}
function onAccount() { attachMarket(); if (!$("#panel").classList.contains("on")) render(); else refreshAcctPanel(); }

async function openAccount(handle){
  handle = (handle || "").trim().toLowerCase().replace(/^@/, "");
  if (!AC.HANDLE.test(handle)) { note = {k: "warn", m: "名前は、英小文字・数字・ハイフンで2〜20文字にしてください。"}; return render(); }
  if (AS.byHandle[handle]) { note = {k: "warn", m: `@${handle} はもう使われています。前に作った本人なら「前のアカウントで開く」から。`}; return render(); }
  const k = await newKey(handle); setMe(k.sk, k.how);
  const e = await emitA({t: "open", handle, display: handle});
  if (!okEv(e)) { note = {k: "warn", m: "開けませんでした。名前を変えてもう一度。"}; me = null; saveMe(); return render(); }
  attachMarket();
  note = {k: "ok", m: k.how === "パスキー" ? "アカウントができました。試験用の 2 ETH と 6,000 ドルが入っています。" : "アカウントができました。この端末ではパスキーが使えないので、かぎはこの端末の中だけにあります。カードを押して、信頼できる人を決めておいてください。"};
  render();
}
async function reopen() {
  const sk = await passkeyOpen();
  if (!sk) { note = {k: "warn", m: "パスキーで開けませんでした。かぎをなくしたときは「取り戻す」から。"}; return render(); }
  setMe(sk, "パスキー");
  if (!myAcct()) { note = {k: "warn", m: "このパスキーのアカウントが、まだ見つかりません。つながるまで少し待つか、取り戻しを頼んでください。"}; return render(); }
  attachMarket(); note = {k: "ok", m: "おかえりなさい。"}; render();
}

/* ---------- 注文 ---------- */
function draft(){
  const qty = toU($("#qty") && $("#qty").value);
  const custom = Number($("#px") && $("#px").value);
  const px = custom > 0 ? custom : side === "buy" ? S.ref * (1 + SLIP) : S.ref * (1 - SLIP);
  if (!qty) return null;
  const usd = BigInt(Math.round(Number(qty) * px));
  return side === "buy"
    ? {sell: "tUSD", buy: "tETH", sellAmount: usd, buyMin: qty, qty, px, custom: custom > 0}
    : {sell: "tETH", buy: "tUSD", sellAmount: qty, buyMin: usd, qty, px, custom: custom > 0};
}
function free(t){ return S.bal[t] - S.mine.filter(o => o.st === "open" && o.sell === t).reduce((s, o) => s + BigInt(o.sellAmount), 0n); }
function hint(d){
  if (!d) return "量を入れてください。";
  if (free(d.sell) < d.sellAmount) return `<span class="s">${TOK[d.sell]}が足りません。</span>`;
  return d.custom ? `1 ETH あたり ${d.px.toFixed(2)} ドル${side === "buy" ? "まで" : "から"}で約定します。` : `いまの値段より1%以上不利なら、約定せずに消えます。`;
}

async function sign(d){
  try {
    if (S.acct.how === "パスキー" && navigator.credentials) await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification: "required", timeout: 60000}});
  } catch (e) { note = {k: "warn", m: "署名をやめました。注文は出ていません。"}; closePanel(); return render(); }
  const o = {id: "m" + S.seq++, owner: S.acct.name, sell: d.sell, buy: d.buy, sellAmount: String(d.sellAmount), buyMin: String(d.buyMin), deadline: now() + 60, st: "open", px: d.px, qty: String(d.qty), side};
  S.mine.unshift(o); S.book.push(o);
  note = {k: "ok", m: "注文を出しました。約定するまで、資産はあなたのアカウントから動きません。"};
  save(); closePanel(); render();
}

/* ---------- ほかの参加者（見本） ---------- */
function botOrders(){
  S.ref = Math.max(500, S.ref * (1 + (Math.random() - 0.5) * 0.01));
  const n = 3 + Math.floor(Math.random() * 4), out = [];
  for (let i = 0; i < n; i++) {
    const sell = Math.random() < 0.5, px = S.ref * (1 + (Math.random() - (sell ? 0.35 : 0.65)) * 0.012);
    const qty = BigInt(Math.round((0.05 + Math.random() * 0.6) * 1e6)), usd = BigInt(Math.round(Number(qty) * px));
    out.push({id: "b" + S.seq++, owner: "参加者", sell: sell ? "tETH" : "tUSD", buy: sell ? "tUSD" : "tETH",
      sellAmount: String(sell ? qty : usd), buyMin: String(sell ? usd : qty), deadline: now() + BATCH + 1, st: "open"});
  }
  return out;
}

function clearNow(){
  const t = now();
  S.book = S.book.filter(o => o.st === "open" && o.deadline > t);
  let expired = false;
  for (const o of S.mine) if (o.st === "open" && o.deadline <= t) { o.st = "expired"; expired = true; }
  const r = A.clear(S.book.concat(botOrders()), "tETH", "tUSD", t);
  const price = r.price ? Number(r.price.n) / Number(r.price.d) : null;
  let got = null;
  for (const f of r.fills) {
    const m = S.mine.find(o => o.id === f.id);
    if (!m) continue;
    S.bal[f.sell] -= BigInt(f.give); S.bal[f.buy] += BigInt(f.receive);
    const left = BigInt(m.sellAmount) - BigInt(f.give);
    if (left > 0n) { m.buyMin = String(BigInt(m.buyMin) * left / BigInt(m.sellAmount)); m.sellAmount = String(left); } else m.st = "done";
    m.last = {give: f.give, receive: f.receive, price};
    got = {f, price};
  }
  S.book = S.book.filter(o => o.st === "open");
  if (price) S.ref = price;
  S.hist.unshift({t, price}); S.hist = S.hist.slice(0, 30);
  if (got) note = {k: "ok", m: `約定しました。${fmt(got.f.give, dp(got.f.sell))} ${TOK[got.f.sell]}を渡して、${fmt(got.f.receive, dp(got.f.buy))} ${TOK[got.f.buy]}を受け取りました。同じまとめの全員が、1 ETH ${got.price.toFixed(2)} ドルで約定しています。`};
  else if (expired) note = {k: "warn", m: "期限までに条件に合う相手がいなかった注文が、何も起きずに消えました。資産は動いていません。"};
  S.next = t + BATCH; save();
  live(!!got || expired, !!got);
}

function spark(){

  const lo = Math.min(...ps), hi = Math.max(...ps), w = 300, h = 40, k = hi - lo || 1;
  const pts = ps.map((p, i) => `${(i / (ps.length - 1) * w).toFixed(1)},${(h - 4 - (p - lo) / k * (h - 8)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

(() => {
  const p = $("#panel"); let x0 = 0, y0 = 0, dx = 0, track = false;
  p.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; track = null; }, {passive: true});
  p.addEventListener("touchmove", e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (track === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) track = Math.abs(mx) > Math.abs(my) * 1.4;
    if (!track) return;
    dx = mx; p.style.transition = "none"; p.style.transform = `translateX(${dx}px)`;
  }, {passive: true});
  p.addEventListener("touchend", () => {
    if (!track) return; p.style.transition = "";
    if (Math.abs(dx) > 70) { p.style.transform = `translateX(${dx > 0 ? 100 : -100}%)`; setTimeout(closePanel, 220); } else p.style.transform = "";
  });

async function act(a, t){
  const id = t && t.dataset.id;
  if (a === "open") return openAccount($("#nm").value);
  if (a === "reopen") return reopen();
  if (a === "lost") return openPanel(lostHtml());
  if (a === "lost-go") {
    const X = AC.byHandle(AS, $("#lost-h").value);
    if (!X) { $("#lost-msg").textContent = "その名前のアカウントが見つかりません。"; return; }
    if (!X.guard.list.length) { $("#lost-msg").textContent = "このアカウントには信頼できる人が決められていないので、取り戻せません。"; return; }
    const k = await newKey(X.handle); setMe(k.sk, k.how); me.recovering = X.id; saveMe();
    await emitA({t: "ask", account: X.id}); closePanel(); return render();
  }
  if (a === "forget") { me = null; saveMe(); S = fresh(); save(); note = null; closePanel(); return render(); }
  if (a === "acct") { gDraft = null; return openPanel(acctHtml()); }
  if (a === "save-card") { await emitA({t: "card", display: $("#pf-d").value.trim(), line: $("#pf-l").value.trim(), links: $("#pf-u").value.trim() ? [$("#pf-u").value.trim()] : []}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "g-add") {
    const X = AC.byHandle(AS, $("#g-add").value), A = myAcct();
    if (!X || X.id === A.id) { $("#g-msg").textContent = "その名前のアカウントが見つかりません（自分は入れられません）。"; return; }
    if (!gDraft.list.includes(X.id)) gDraft.list.push(X.id); $("#pbody").innerHTML = acctHtml(); return;
  }
  if (a === "g-del") { gDraft.list = gDraft.list.filter(x => x !== id); $("#pbody").innerHTML = acctHtml(); return; }
  if (a === "g-save") {
    const need = gDraft.list.length ? Math.max(1, Math.min(gDraft.list.length, parseInt($("#g-need").value) || 1)) : 0;
    const e = await emitA({t: "guard", list: gDraft.list, need}); gDraft = null; $("#pbody").innerHTML = acctHtml(); render();
    $("#g-msg").textContent = okEv(e) ? "" : "決められませんでした。"; if (okEv(e)) { note = {k: "ok", m: "信頼できる人を決めました。"}; } return;
  }
  if (a === "approve") { await emitA({t: "approve", account: id, to: t.dataset.to}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "cancel-rec") { await emitA({t: "cancel", to: id}); $("#pbody").innerHTML = acctHtml(); render(); return; }
  if (a === "how") return openPanel(howHtml());
  if (a === "back") return closePanel();
  if (a === "dismiss") { note = null; $("#note") ? ($("#note").innerHTML = "") : render(); return; }
  if (a === "review") {
    const d = draft(); if (!d) return;
    if (free(d.sell) < d.sellAmount) { note = {k: "warn", m: `${TOK[d.sell]}が足りません。`}; $("#note").innerHTML = noteHtml(); return; }
    pending = d; return openPanel(reviewHtml(d));
  }
  if (a === "sign") return pending && sign(pending);
  if (a === "cancel") { for (const o of S.mine) if (o.st === "open") o.st = "cancelled"; S.book = S.book.filter(o => !o.id.startsWith("m")); note = {k: "ok", m: "注文を取り消しました。資産は最初から動いていません。"}; save(); return live(true); }
}
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-act],[data-side]");
  if (!t) return;
  if (t.dataset.side) { side = t.dataset.side; S.lastQty = $("#qty") ? $("#qty").value : S.lastQty; return render(); }
  act(t.dataset.act, t);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#panel").classList.contains("on")) closePanel(); });
$("#reset").onclick = () => { const id = S.acct && S.acct.id; S = fresh(); note = null; closePanel(); save(); attachMarket(); render(); };
setInterval(() => { if (S.acct && myAcct() && S.next - now() <= 0) clearNow(); }, 1000);
setInterval(() => { const before = myAcct(); recount(); if (!before && myAcct()) onAccount(); flush(); netStatus(); }, 15000);   // 取り戻しの3日などを数え直す
if (me && !myAcct() && S.acct && !S.acct.id) { S = fresh(); save(); }   // 前の試作の台帳は使わない
render();
if ("WebSocket" in window) for (const u of RELAYS) connectOne(u, 2000);
window.__acct = {tick: () => { recount(); onAccount(); render(); }, get AS() { return AS; }, get me() { return me; }};
</script>
