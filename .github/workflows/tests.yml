name: tests

# 計算の約束（条件より不利にならない・資産が増えも消えもしない）を、変更のたびに確かめる
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tests/*.test.js"
      - name: index.html が app.html と core/auction.js から作り直されているか
        run: python3 tools/build.py && git diff --exit-code index.html
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 画面を操作して確かめる（スマホとパソコンの幅）
        run: node tests/app.e2e.js 400 && node tests/app.e2e.js 1200
